<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/config.js"></script>
    <title>Voxaa - AI Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0a0b0f;
            --surface: #13141f;
            --primary: #7C3AED;
            --secondary: #64ffda;
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .translation-container {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            width: 100%;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards 0.2s;
        }

        .language-selector {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .language-selector-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .language-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .language-btn {
            background: var(--surface);
            border: 1px solid rgba(124, 58, 237, 0.2);
            color: var(--text);
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }

        .swap-btn {
            background: var(--primary);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .swap-btn:hover {
            transform: rotate(180deg);
        }

        .language-btn.active {
            background: var(--primary);
            border-color: var(--primary);
        }

        .language-btn:hover {
            transform: translateY(-2px);
            border-color: var(--primary);
        }

        .translation-box {
            background: var(--surface);
            border-radius: 16px;
            padding: 2rem;
            border: 1px solid rgba(124, 58, 237, 0.2);
            transition: all 0.3s ease;
            position: relative;
        }

        .translation-box:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .translation-content {
            display: flex;
            gap: 2rem;
        }

        .translation-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .translation-side-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-align: center;
        }

        .mic-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--primary);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1rem auto;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .mic-button::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: rgba(124, 58, 237, 0.5);
            border-radius: 50%;
            transform: scale(0);
            transition: transform 0.3s ease;
        }

        .mic-button.active::before {
            animation: pulse 1.5s infinite;
        }

        .mic-icon {
            width: 24px;
            height: 24px;
            fill: white;
            z-index: 1;
        }

        .transcription {
            min-height: 100px;
            padding: 1rem;
            background: rgba(124, 58, 237, 0.1);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .wave-container {
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .wave-container.active {
            opacity: 1;
        }

        .wave-bar {
            width: 3px;
            height: 20px;
            background: var(--secondary);
            border-radius: 3px;
            animation: wave 1s ease-in-out infinite;
        }

        .divider {
            width: 2px;
            background: rgba(124, 58, 237, 0.2);
            margin: 0 1rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }

        @keyframes wave {
            0%, 100% {
                height: 20px;
            }
            50% {
                height: 40px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .translation-content {
                flex-direction: column;
            }

            .divider {
                width: 100%;
                height: 2px;
                margin: 1rem 0;
            }

            .language-selector {
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>Voxaa - AI Translator</h1>
            <p>Select languages and start speaking</p>
        </header>

        <main class="translation-container">
            <div class="language-selector">
                <div class="language-selector-group">
                    <span class="language-label">From</span>
                    <select class="language-btn" id="fromLanguage">
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="ar">Arabic</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>

                <button class="swap-btn" id="swapLanguages">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 16V4M7 4L3 8M7 4L11 8M17 8V20M17 20L21 16M17 20L13 16"/>
                    </svg>
                </button>

                <div class="language-selector-group">
                    <span class="language-label">To</span>
                    <select class="language-btn" id="toLanguage">
                        <option value="hi">Hindi</option>
                        <option value="en">English</option>
                        <option value="ar">Arabic</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="ja">Japanese</option>
                        <option value="zh">Chinese</option>
                    </select>
                </div>
            </div>

            <div class="translation-box">
                <div class="translation-content">
                    <div class="translation-side">
                        <div class="translation-side-label">Original</div>
                        <div class="wave-container">
                            <div class="wave-bar" style="animation-delay: -1.2s"></div>
                            <div class="wave-bar" style="animation-delay: -1.0s"></div>
                            <div class="wave-bar" style="animation-delay: -0.8s"></div>
                            <div class="wave-bar" style="animation-delay: -0.6s"></div>
                            <div class="wave-bar" style="animation-delay: -0.4s"></div>
                        </div>
                        <button class="mic-button" id="micButton">
                            <svg class="mic-icon" viewBox="0 0 24 24">
                                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                                <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                            </svg>
                        </button>
                        <div class="transcription" id="originalText">
                            <p>Tap the microphone to start speaking...</p>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="translation-side">
                        <div class="translation-side-label">Translation</div>
                        <div class="transcription" id="translatedText">
                            <p>Translation will appear here...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Initialize Web Speech API
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        const speechSynthesis = window.speechSynthesis;
    
        // DOM Elements
        const micButton = document.getElementById('micButton');
        const waveContainer = document.querySelector('.wave-container');
        const originalTextDiv = document.getElementById('originalText');
        const translatedTextDiv = document.getElementById('translatedText');
        const fromLanguageSelect = document.getElementById('fromLanguage');
        const toLanguageSelect = document.getElementById('toLanguage');
        const swapButton = document.getElementById('swapLanguages');
    
        // Variables
        let isListening = false;
        let isBaseLanguage = true;
        let currentSpeakingLanguage = '';
        let hasIntroduced = false;
        const GEMINI_API_KEY = window.ENV_GEMINI_API_KEY;
    
        // Configure speech recognition
        recognition.continuous = true;
        recognition.interimResults = true;
    
        // Gemini translation function
        async function translateText(text, fromLang, toLang) {
            const instructions = `You are a translation assistant. Follow these core rules:

1. Translation Accuracy:
   - Translate exactly what is said, word-for-word
   - Do not add explanations or engage in conversation
   - Keep all formatting, emphasis, and punctuation
   - Preserve numbers and names exactly as written

2. Language Direction:
   - From ${fromLang} to ${toLang}: Translate ${fromLang} input
   - From ${toLang} to ${fromLang}: Translate ${toLang} input
   - If language is unclear, ask for clarification
   - Handle any mixed language use appropriately

3. Style and Tone:
   - Keep a warm, professional tone
   - Use clear, simple language
   - Match the original's level of formality
   - Maintain cultural sensitivity`
    
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{
                                text: `${instructions}\n\nTranslate the following text from ${fromLang} to ${toLang}:\n${text}`
                            }]
                        }]
                    })
                });
    
                const data = await response.json();
                return data.candidates[0].content.parts[0].text;
            } catch (error) {
                console.error('Translation error:', error);
                return 'Translation error occurred. Please try again.';
            }
        }
    
        // Handle microphone button click
        micButton.addEventListener('click', () => {
            if (!isListening) {
                startListening();
            } else {
                stopListening();
            }
        });
    
        // Start listening function
        async function startListening() {
            try {
                if (!hasIntroduced) {
                    // First introduction in English
                    const engIntro = "Hi, I'm Voxaa. I'll be your translator today. Begin speaking.";
                    originalTextDiv.innerHTML = `<p>${engIntro}</p>`;
                    await speak(engIntro, 'en');
    
                    // Second introduction in target language
                    const targetIntro = await translateText(
                        "Hi, I'm Voxaa. I'll be your translator today.",
                        'en',
                        toLanguageSelect.value
                    );
                    translatedTextDiv.innerHTML = `<p>${targetIntro}</p>`;
                    await speak(targetIntro, toLanguageSelect.value);
                    
                    hasIntroduced = true;
                }
    
                // Set the recognition language based on who's speaking
                const currentLang = isBaseLanguage ? fromLanguageSelect.value : toLanguageSelect.value;
                recognition.lang = getLanguageCode(currentLang);
                currentSpeakingLanguage = currentLang;
                
                recognition.start();
                isListening = true;
                micButton.classList.add('active');
                waveContainer.classList.add('active');
                originalTextDiv.innerHTML = `<p>Listening in ${getLanguageName(currentLang)}...</p>`;
            } catch (error) {
                console.error('Error starting recognition:', error);
            }
        }
    
        // Get language name for display
        function getLanguageName(code) {
            const languages = {
                'en': 'English',
                'hi': 'Hindi',
                'ar': 'Arabic',
                'de': 'German',
                'es': 'Spanish',
                'ja': 'Japanese',
                'zh': 'Chinese'
            };
            return languages[code] || code;
        }
    
        // Stop listening function
        function stopListening() {
            recognition.stop();
            isListening = false;
            micButton.classList.remove('active');
            waveContainer.classList.remove('active');
            isBaseLanguage = true; // Reset to base language when stopping
            originalTextDiv.innerHTML = '<p>Tap the microphone to start speaking...</p>';
            translatedTextDiv.innerHTML = '<p>Translation will appear here...</p>';
        }
    
        // Handle speech recognition results
        recognition.onresult = async (event) => {
            const transcript = Array.from(event.results)
                .map(result => result[0])
                .map(result => result.transcript)
                .join('');
    
            originalTextDiv.innerHTML = `<p>${transcript}</p>`;
    
            // Translate the text when the speech segment is final
            if (event.results[0].isFinal) {
                // Determine translation direction based on current speaker
                const fromLang = isBaseLanguage ? fromLanguageSelect.value : toLanguageSelect.value;
                const toLang = isBaseLanguage ? toLanguageSelect.value : fromLanguageSelect.value;
    
                try {
                    const translation = await translateText(
                        transcript,
                        fromLang,
                        toLang
                    );
                    
                    translatedTextDiv.innerHTML = `<p>${translation}</p>`;
                    
                    // Speak the translation
                    await speak(translation, toLang);
    
                    // Switch the speaking direction for the next utterance
                    isBaseLanguage = !isBaseLanguage;
                    
                    // Restart recognition with the new language
                    recognition.stop();
                    setTimeout(() => {
                        if (isListening) {
                            startListening();
                        }
                    }, 500); // Increased delay to ensure proper restart
                } catch (error) {
                    console.error('Translation or speech error:', error);
                }
            }
        };
    
        // Handle speech recognition errors
        recognition.onerror = (event) => {
            console.error('Recognition error:', event.error);
            stopListening();
            originalTextDiv.innerHTML = '<p>Error occurred. Please try again.</p>';
        };
    
        // Swap languages function
        swapButton.addEventListener('click', () => {
            const fromValue = fromLanguageSelect.value;
            fromLanguageSelect.value = toLanguageSelect.value;
            toLanguageSelect.value = fromValue;
    
            // Clear existing translations
            originalTextDiv.innerHTML = '<p>Tap the microphone to start speaking...</p>';
            translatedTextDiv.innerHTML = '<p>Translation will appear here...</p>';
            
            // Reset the speaking direction
            isBaseLanguage = true;
        });
    
        // Get language code for speech recognition
        function getLanguageCode(language) {
            const languageCodes = {
                'en': 'en-US',
                'hi': 'hi-IN',
                'ar': 'ar-SA',
                'de': 'de-DE',
                'es': 'es-ES',
                'ja': 'ja-JP',
                'zh': 'zh-CN'
            };
            return languageCodes[language] || 'en-US';
        }
    
        // Text-to-speech function
        function speak(text, language) {
            return new Promise((resolve, reject) => {
                speechSynthesis.cancel();
    
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = getLanguageCode(language);
                
                utterance.onend = () => {
                    resolve();
                };
                
                utterance.onerror = (error) => {
                    reject(error);
                };
    
                // Get available voices
                let voices = speechSynthesis.getVoices();
                if (voices.length === 0) {
                    // If voices aren't loaded yet, wait for them
                    speechSynthesis.onvoiceschanged = () => {
                        voices = speechSynthesis.getVoices();
                        setVoice();
                    };
                } else {
                    setVoice();
                }
    
                function setVoice() {
                    // Try to find a female voice for the selected language
                    const femaleVoice = voices.find(voice => 
                        voice.lang.includes(getLanguageCode(language)) && 
                        voice.name.toLowerCase().includes('female')
                    );
                    
                    if (femaleVoice) {
                        utterance.voice = femaleVoice;
                    } else {
                        // Fallback to any voice for that language
                        const langVoice = voices.find(voice => 
                            voice.lang.includes(getLanguageCode(language))
                        );
                        if (langVoice) utterance.voice = langVoice;
                    }
                }
    
                // Adjust speech parameters for more natural sound
                utterance.rate = 1.0;  // Normal speed
                utterance.pitch = 1.1; // Slightly higher pitch for female voice
                utterance.volume = 1.0; // Full volume
                
                speechSynthesis.speak(utterance);
            });
        }
    
        // Load voices when they're available
        speechSynthesis.onvoiceschanged = () => {
            console.log('Available voices:', speechSynthesis.getVoices());
        };
    </script>
</body>
</html>
